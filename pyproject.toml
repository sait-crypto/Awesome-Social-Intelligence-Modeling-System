[project]
name = "awesome-social-media-llm-based-analysis"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"

# Runtime dependencies required by the GitHub Actions workflows.
dependencies = [
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "pillow>=12.1.0",
    "pypdf>=6.6.2",

]

# Development, packaging, and local debugging dependencies.
[dependency-groups]
dev = [
    "requests>=2.32.5",
    "pyinstaller>=6.18.0",
    "pytest>=8.4.2",
    "tkinterdnd2>=0.4.3",
]

# Install all dependency groups with either command below:
# uv install --all-groups
# uv sync --all-groups
