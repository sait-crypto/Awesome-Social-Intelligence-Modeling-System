name: Suggest a paper
description: Propose a paper for the Social Intelligence Modeling living survey.
title: "[Paper Submission] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping keep the survey current. Submissions are public and remain separate from the curated database until validation and maintainer approval.
        After submitting, keep this issue open and select GitHub's **Subscribe** control. Waiting-for-review status, validation results, processing outcomes, duplicate or rejection reasons, and maintainer feedback are posted here.

  - type: input
    id: title
    attributes:
      label: Paper title
      placeholder: Full paper title
    validations:
      required: true

  - type: input
    id: doi
    attributes:
      label: DOI
      description: Optional. Enter the DOI without a https://doi.org/ prefix; a placeholder is generated when omitted.
      placeholder: 10.xxxx/xxxxx

  - type: input
    id: paper_url
    attributes:
      label: Paper URL
      placeholder: https://...
    validations:
      required: true

  - type: textarea
    id: authors
    attributes:
      label: Authors
      placeholder: Full author list
    validations:
      required: true

  - type: input
    id: publication_date
    attributes:
      label: Publication date
      description: Use YYYY-MM-DD when the exact date is known.
      placeholder: YYYY-MM-DD
    validations:
      required: true

  - type: textarea
    id: abstract
    attributes:
      label: Abstract
      render: text
    validations:
      required: true

  - type: textarea
    id: pipeline_image
    attributes:
      label: Pipeline image
      description: Recommended. Drag or paste up to four method, framework, or pipeline images here; each image must be no larger than 10 MiB.

  - type: textarea
    id: paper_file
    attributes:
      label: Paper file
      description: Recommended. Drag the original PDF here so the automation can generate higher-quality summaries; maximum size 50 MiB.

  - type: checkboxes
    id: public_submission
    attributes:
      label: Submission checks
      options:
        - label: I understand this issue is public, contains no private contact information, and only includes files I am permitted to share.
          required: true
        - label: I checked that this paper is not already present in the paper explorer.
          required: true

  - type: markdown
    attributes:
      value: |
        This public issue is the primary submission record and remains open during review and processing. The linked pull request is only a backend processing artifact. Use GitHub's **Subscribe** control for every status update; do not post a private email address here.
