name: Suggest a paper
description: Propose a paper for the Social Intelligence Modeling living survey.
title: "[Paper Submission] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping keep the survey current. Submissions are public and remain separate from the curated database until validation and maintainer approval.

  - type: input
    id: title
    attributes:
      label: Paper title
      placeholder: Full paper title
    validations:
      required: true

  - type: input
    id: doi
    attributes:
      label: DOI
      description: Enter the DOI without a https://doi.org/ prefix.
      placeholder: 10.xxxx/xxxxx
    validations:
      required: true

  - type: input
    id: paper_url
    attributes:
      label: Paper URL
      placeholder: https://...
    validations:
      required: true

  - type: input
    id: project_url
    attributes:
      label: Project URL
      description: Code, data, or project page when available.
      placeholder: https://github.com/...

  - type: textarea
    id: authors
    attributes:
      label: Authors
      placeholder: Full author list
    validations:
      required: true

  - type: input
    id: publication_date
    attributes:
      label: Publication date
      description: Use YYYY-MM-DD when the exact date is known.
      placeholder: YYYY-MM-DD
    validations:
      required: true

  - type: input
    id: venue
    attributes:
      label: Venue
      placeholder: ACL 2026, arXiv, ...

  - type: input
    id: contributor
    attributes:
      label: Contributor
      description: Name or GitHub handle to credit. If left blank, the issue author is used. Community provenance is added automatically.
      placeholder: "@github-login or display name"

  - type: textarea
    id: categories
    attributes:
      label: Categories
      description: Copy one to four exact task names from the survey website and separate them with a vertical bar (|).
      placeholder: Hate Speech Analysis | Meme and Multimodal Understanding
    validations:
      required: true

  - type: textarea
    id: abstract
    attributes:
      label: Abstract
      render: text
    validations:
      required: true

  - type: textarea
    id: pipeline_image
    attributes:
      label: Pipeline image
      description: Recommended. Drag or paste one to three method, framework, or pipeline images here; each image must be no larger than 10 MiB.

  - type: textarea
    id: notes
    attributes:
      label: Additional notes
      description: Optional classification guidance or related papers.

  - type: checkboxes
    id: public_submission
    attributes:
      label: Submission checks
      options:
        - label: I understand this issue is public and contains no private contact information or copyrighted paper PDF.
          required: true
        - label: I checked that this paper is not already present in the paper explorer.
          required: true

  - type: markdown
    attributes:
      value: |
        Processing results and maintainer feedback are posted to this public issue or its linked processing pull request and mention the submitter. Use GitHub's **Subscribe** control if you want a notification for every update; do not post a private email address here.
