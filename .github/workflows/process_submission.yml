name: Process Paper Submission

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled]
    branches: [main]

concurrency:
  group: paper-submission-main-update
  cancel-in-progress: false

jobs:
  process-submission:
    if: >-
      vars.AUTO_PROCESS_SUBMISSIONS == 'true' ||
      contains(github.event.pull_request.labels.*.name, 'Action: Process')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      PR_ASSETS_DIR: ${{ github.workspace }}/pr_workspace_assets
      PR_FIGURES_DIR: ${{ github.workspace }}/pr_workspace_figures
      AUTO_AI_GENERATION: "true"
      EPHEMERAL_PAPER_FILES: "true"

    steps:
      # All executable code and both databases come from the trusted main branch.
      - name: Check out trusted main branch
        uses: actions/checkout@v6
        with:
          ref: main
          path: main_workspace
          fetch-depth: 0

      # The contributor checkout is treated as untrusted data only.
      - name: Check out pull request data
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          path: pr_workspace
          fetch-depth: 1
          persist-credentials: false

      # Preserve the contributor's source update independently of later
      # validation, AI generation, database updates, or push failures.
      - name: Preserve submitted update files
        uses: actions/upload-artifact@v6
        continue-on-error: true
        with:
          name: paper-submission-pr-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
          path: |
            pr_workspace/submit_template.json
            pr_workspace/submit_template.csv
          if-no-files-found: warn
          retention-days: 90

      - name: Build isolated processing workspace
        shell: bash
        run: |
          set -euo pipefail
          echo "BASE_MAIN_SHA=$(git -C main_workspace rev-parse HEAD)" >> "$GITHUB_ENV"

          find pr_workspace -type l -delete

          if [ -f pr_workspace/submit_template.csv ]; then
            cp pr_workspace/submit_template.csv main_workspace/
          fi
          if [ -f pr_workspace/submit_template.json ]; then
            cp pr_workspace/submit_template.json main_workspace/
          fi

          copy_changed_resources() {
            local source_root="$1"
            local trusted_root="$2"
            local staging_root="$3"
            [ -d "$source_root" ] || return 0

            while IFS= read -r -d '' source_file; do
              relative_path="${source_file#"$source_root"/}"
              trusted_file="$trusted_root/$relative_path"
              if [ ! -f "$trusted_file" ] || ! cmp -s "$source_file" "$trusted_file"; then
                mkdir -p "$staging_root/$(dirname "$relative_path")"
                cp -- "$source_file" "$staging_root/$relative_path"
              fi
            done < <(find "$source_root" -type f -print0)
          }

          # Stage only resources added or changed by this pull request. Counting
          # the contributor checkout's full tracked asset tree would apply the
          # per-submission limit to historical repository files as well.
          copy_changed_resources \
            pr_workspace/engineering/assets \
            main_workspace/engineering/assets \
            pr_workspace_assets
          copy_changed_resources \
            pr_workspace/assets \
            main_workspace/engineering/assets \
            pr_workspace_assets
          copy_changed_resources \
            pr_workspace/figures \
            main_workspace/figures \
            pr_workspace_figures

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.12"
          python-version: "3.13"
          working-directory: main_workspace

      - name: Install locked dependencies
        working-directory: main_workspace
        run: uv sync --frozen

      - name: Snapshot databases for integrity checks
        working-directory: main_workspace
        env:
          PYTHONPATH: engineering
        shell: bash
        run: |
          set -euo pipefail
          CORE_DB_PATH=$(uv run --frozen python -c "from src.core.config_loader import get_config_instance; print(get_config_instance().settings['paths']['database'])")
          COMPLETE_DB_PATH=$(uv run --frozen python -c "from src.core.config_loader import get_config_instance; print(get_config_instance().settings['paths']['complete_list_database'])")
          echo "CORE_DB_PATH=$CORE_DB_PATH" >> "$GITHUB_ENV"
          echo "COMPLETE_DB_PATH=$COMPLETE_DB_PATH" >> "$GITHUB_ENV"
          cp "$CORE_DB_PATH" "$RUNNER_TEMP/core-database-before.csv"
          cp "$COMPLETE_DB_PATH" "$RUNNER_TEMP/complete-database-before.csv"

      - name: Validate submission file boundaries
        working-directory: main_workspace
        shell: bash
        run: |
          set -euo pipefail
          found_submission=false

          for file in submit_template.csv submit_template.json; do
            if [ -s "$file" ]; then
              found_submission=true
              file_size=$(stat -c%s "$file")
              if [ "$file_size" -gt 5242880 ]; then
                echo "Error: $file exceeds the 5 MiB submission limit."
                exit 1
              fi
            fi
          done

          if [ "$found_submission" != true ]; then
            echo "Error: no non-empty submit_template.csv or submit_template.json was supplied."
            exit 1
          fi

          for asset_dir in "$PR_ASSETS_DIR" "$PR_FIGURES_DIR"; do
            if [ -d "$asset_dir" ]; then
              asset_count=$(find "$asset_dir" -type f | wc -l)
              if [ "$asset_count" -gt 25 ]; then
                echo "Error: the submission contains more than 25 asset files."
                exit 1
              fi
              if find "$asset_dir" -type f ! -iname '*.pdf' -size +10M -print -quit | grep -q .; then
                echo "Error: each submitted non-PDF asset must be no larger than 10 MiB."
                exit 1
              fi
              if find "$asset_dir" -type f -iname '*.pdf' -size +50M -print -quit | grep -q .; then
                echo "Error: each submitted PDF must be no larger than 50 MiB."
                exit 1
              fi
            fi
          done

      # Archive bounded resources before validation, AI generation, or database
      # processing so they remain downloadable when a later step fails.
      - name: Preserve submitted resources
        uses: actions/upload-artifact@v6
        continue-on-error: true
        with:
          name: paper-submission-resources-pr-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
          path: |
            pr_workspace_assets
            pr_workspace_figures
          if-no-files-found: ignore
          retention-days: 90

      - name: Validate paper metadata
        id: validate
        working-directory: main_workspace
        env:
          PYTHONPATH: engineering
        shell: bash
        run: |
          set -o pipefail
          uv run --frozen engineering/scripts/validate_submission.py 2>&1 | tee validation_log.txt

      - name: Comment on validation failure
        if: failure() && steps.validate.outcome == 'failure'
        uses: actions/github-script@v9
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        with:
          script: |
            const fs = require('fs');
            let logContent = 'Validation log is unavailable.';
            try {
              logContent = fs.readFileSync('main_workspace/validation_log.txt', 'utf8');
            } catch (error) {
              core.warning(String(error));
            }
            const body = [
              '### Validation failed',
              `Hi @${process.env.PR_AUTHOR}, the automated checks found problems with this submission.`,
              '<details><summary>Validation log</summary>',
              '',
              '```text',
              logContent,
              '```',
              '</details>',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Stage temporary paper PDFs
        working-directory: main_workspace
        env:
          PYTHONPATH: engineering
        run: >-
          uv run --frozen engineering/scripts/temporary_submission_pdfs.py
          stage --manifest "$RUNNER_TEMP/paper-pdf-manifest.json"

      - name: Normalize submitted assets
        working-directory: main_workspace
        env:
          PYTHONPATH: engineering
        run: uv run --frozen engineering/scripts/update_submission_figures.py

      - name: Update databases and generated lists
        id: core_update
        working-directory: main_workspace
        env:
          PYTHONPATH: engineering
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_API_KEYS: ${{ secrets.AI_API_KEYS }}
          AI_AUTO_GENERATE_FIELDS: ${{ vars.AI_AUTO_GENERATE_FIELDS }}
        shell: bash
        run: |
          set -o pipefail
          uv run --frozen engineering/src/update.py 2>&1 | tee update_log.txt

      - name: Comment with update result
        if: always() && steps.core_update.conclusion != 'skipped'
        uses: actions/github-script@v9
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          UPDATE_OUTCOME: ${{ steps.core_update.outcome }}
        with:
          script: |
            const fs = require('fs');
            let logContent = 'Update log is unavailable.';
            try {
              logContent = fs.readFileSync('main_workspace/update_log.txt', 'utf8');
            } catch (error) {
              core.warning(String(error));
            }
            const heading = process.env.UPDATE_OUTCOME === 'success'
              ? '### Core update completed'
              : '### Core update failed';
            const body = [
              heading,
              `Hi @${process.env.PR_AUTHOR}, the trusted main-branch update script has finished.`,
              '<details><summary>Update log</summary>',
              '',
              '```text',
              logContent,
              '```',
              '</details>',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Remove temporary paper PDFs
        if: always()
        working-directory: main_workspace
        env:
          PYTHONPATH: engineering
        run: >-
          uv run --frozen engineering/scripts/temporary_submission_pdfs.py
          cleanup --manifest "$RUNNER_TEMP/paper-pdf-manifest.json"

      - name: Verify database integrity
        working-directory: main_workspace
        env:
          PYTHONPATH: engineering
        run: >-
          uv run --frozen engineering/scripts/verify_database_integrity.py
          --before "$RUNNER_TEMP/core-database-before.csv"
          --after "$CORE_DB_PATH"
          --before "$RUNNER_TEMP/complete-database-before.csv"
          --after "$COMPLETE_DB_PATH"

      - name: Commit and push generated changes to main
        working-directory: main_workspace
        env:
          PYTHONPATH: engineering
          PR_USER: ${{ github.event.pull_request.user.login }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if find engineering/assets -type f -iname '*.pdf' -print -quit | grep -q .; then
            echo "Error: temporary PDFs remain in the trusted working tree."
            exit 1
          fi

          git add -f "$CORE_DB_PATH" "$COMPLETE_DB_PATH" README.md COMPLETE_LIST.md engineering/assets/ ':!engineering/assets/**/*.pdf'

          if git diff --cached --name-only | grep -Eiq '\.pdf$'; then
            echo "Error: refusing to commit a PDF to main."
            exit 1
          fi

          if git diff --staged --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi

          git commit -m "Process paper submission from @$PR_USER [skip ci]"

          git fetch origin main
          CURRENT_MAIN_SHA=$(git rev-parse origin/main)
          if [ "$CURRENT_MAIN_SHA" != "$BASE_MAIN_SHA" ]; then
            echo "Error: main changed during processing; refusing a non-fast-forward or stale update."
            echo "Re-run the workflow against the current main branch."
            exit 1
          fi

          git push origin HEAD:main

      - name: Send optional email notification
        if: always()
        working-directory: main_workspace
        env:
          PYTHONPATH: engineering
          NOTIFICATION_EMAIL: ${{ vars.NOTIFICATION_EMAIL }}
          SMTP_SERVER: ${{ vars.SMTP_SERVER }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USER: ${{ vars.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          workflow_status: ${{ job.status }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_USER: ${{ github.event.pull_request.user.login }}
        run: uv run --frozen engineering/scripts/send_notification.py

      - name: Report workflow failure
        if: failure()
        uses: actions/github-script@v9
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const body = [
              '### Automatic processing failed',
              `Hi @${process.env.PR_AUTHOR}, this submission was not applied to the database.`,
              '',
              `[Open the workflow run](${process.env.RUN_URL}) to inspect the failure and download the preserved submission artifacts.`,
              'The original files also remain available from this pull request branch.',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
