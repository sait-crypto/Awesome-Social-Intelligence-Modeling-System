name = "sim-paper-submission-upload"
main = "src/index.js"
compatibility_date = "2026-08-28"
workers_dev = true
preview_urls = false

[[kv_namespaces]]
binding = "SUBMISSION_FILES"
id = "7ed9253d15c548f795b003393fdd15c4"

[[ratelimits]]
name = "UPLOAD_RATE_LIMITER"
namespace_id = "104729"

  [ratelimits.simple]
  limit = 20
  period = 60

[vars]
ALLOWED_ORIGINS = "https://sait-crypto.github.io,http://127.0.0.1:8765,http://localhost:8765"
FILE_TTL_SECONDS = "604800"
